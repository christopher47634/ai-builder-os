name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 数据校验（JSON Schema + 语义检查）
        run: npm run validate:data

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Python 抽取脚本测试
        run: |
          python -m pip install pytest
          python -m pytest tests/py -q

      - name: 导出 promptfoo tests（仅格式转换，不调用模型）
        run: npm run export:promptfoo

      - name: 构建
        run: npm run build
        env:
          GITHUB_PAGES: "true"
